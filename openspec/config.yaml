context: |
  「智多星——企业级多智能体平台」工程实践项目：基于 LangChain + LangGraph + Milvus
  的多 Agent 系统，以自然语言完成知识问答、数据分析、业务执行三类工作。
  当前没有真实企业使用；自动化、模拟与参考环境证据必须与企业现场验证分开。

  技术栈：Python 3.11+ / FastAPI / LangGraph 1.2+ / LangChain 1.x / Milvus 2.4 / PostgreSQL 16 /
  Redis 7(redis-stack-server) / 百炼北京 text-embedding-v4 (1024 维) 与 qwen3-rerank /
  DeepSeek Flash (默认) 与 v4-pro (复杂任务)。旧本地模型仅作开发可选项。

  工程约定：PEP 8、行宽 100、全量类型注解、异步代码优先、类在 __init__ 初始化全部属性；
  密钥只从环境变量读取(.env 永不提交)；SQL 一律参数化；外部 API 调用设置超时与重试；
  所有外部输入视为不可信；破坏性操作先与用户确认；修改后端行为后运行 eval/ 脚本验证。

  文档规范：文档统一存放在 docs/ 六大层(10-product-plan 产品方案 / 20-product 产品文档 /
  30-guides 操作手册 / 40-process 过程记录 / 50-engineering 工程文档 / 60-knowledge 知识数据库
  + 90-archive 归档)；面试与演示资产在 interview/；根目录 contents.md 为目录树索引、
  CHANGELOG.md 为版本变更、README.md 为唯一导航入口；ROADMAP/DECISIONS/ISSUES 各为单一事实源。

  当前状态(2026-10-17)：主规格 15 项、已归档 change 15 项；active change 为
  crm-mail-sso-integration、uat-and-ga-rollout 与 engineering-delivery-closeout。
  engineering-delivery-closeout 的 S0/C24/C01 配置增量已推送，C01 运行验收 BLOCKED；
  C02 模型契约与离线实现已完成，libpq5 已获批并补入配方；外部模型方案已确认，真实 API/Linux 验收 BLOCKED，C03 及后续尚未授权。工程交付边界见 docs/50-engineering/engineering-delivery-baseline.md；
  C01-C25 的现状/缺口/验收以 ISSUES 为准，S0-S7 顺序以 ROADMAP 为准。
  真实企业联调、UAT、灰度与全量放行仍缺资源，不用参考服务成功替代这些任务。
  OpenSpec CLI 本机不可用；结构检查不能替代严格校验，归档前须补齐。
  Kimi Code(.kimi-code/skills/)与 Codex(.codex/skills/)各有 6 个工作流 skill；
  新需求遵守 explore → propose → apply → archive，运行时契约变更先补对应 delta。

