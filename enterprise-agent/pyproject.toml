[project]
name = "enterprise-agent"
version = "1.3.0"
description = "Hello，智多星——企业知识工作流 Agent - 基于 LangChain + LangGraph + Milvus"
requires-python = ">=3.11"
dependencies = [
    # LangChain 生态
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-cohere>=0.3.0",
    "langchain-community>=0.4",
    "langchain-huggingface>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.0",
    # LangGraph
    "langgraph>=1.2",
    "langgraph-checkpoint-redis>=0.5",
    "langsmith>=0.1.100",
    # 向量库
    "pymilvus>=2.4.0,<3.1",
    # 本地 Embedding(bge-m3)
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "numpy>=1.26",
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # 数据库
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    # HTTP 客户端
    "httpx>=0.27",
    # 安全
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "circuitbreaker>=2.0",
    # 数据校验
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # 文档处理
    "pypdf>=4.0",
    "python-docx>=1.1",
    "unstructured>=0.15",
    # 可观测性
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.45",
    "prometheus-client>=0.20",
    # 工具
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.20",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipython>=8.20",
]
eval = [
    "langchain-evaluation>=0.3",
    "ragas>=0.1",
    "datasets>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
