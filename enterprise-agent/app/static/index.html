  methods: {
    showToast(msg, ms = 2600) {
      const epoch = this.authEpoch;
      this.toast = msg;
      setTimeout(() => { if (epoch === this.authEpoch && this.toast === msg) this.toast = ''; }, ms);
    },
    async api(path, opts = {}) {
      if (!path.startsWith('/') || path.startsWith('//') || location.protocol === 'file:')
        throw new Error('请通过服务地址访问页面');
      const headers = { 'Content-Type': 'application/json; charset=utf-8', ...(opts.headers || {}) };
      if (this.token) headers.Authorization = 'Bearer ' + this.token;
      const epoch = this.authEpoch, controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      let acknowledged = false;
      try {
        const resp = await fetch(path, { ...opts, headers, signal: controller.signal, redirect: 'error' });
        if (epoch !== this.authEpoch) throw new Error('登录状态已变化');
        if (resp.status === 401) { this.doLogout('登录未通过或已过期，请重新登录'); throw new Error('登录已过期，请重新登录'); }
        if (!resp.ok) {
          acknowledged = resp.status < 500;
          if (resp.status === 403) this.clearProtectedViews();
          throw new Error('请求未完成（HTTP ' + resp.status + '），请核对权限与记录');
        }
        const text = await resp.text();
        if (epoch !== this.authEpoch) throw new Error('登录状态已变化');
        if (text.length > 2097152) throw new Error('响应超出限制');
        const data = JSON.parse(text);
        if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('响应格式无效');
        return data;
      } catch (error) {
        const failure = new Error(error.name === 'AbortError' ? '请求超时，请核对记录' :
          error instanceof SyntaxError ? '响应格式无效，请核对记录' : error.message);
        failure.outcomeUnknown = !acknowledged && !['GET', 'HEAD'].includes(opts.method || 'GET');
        throw failure;
      } finally { clearTimeout(timer); }
    },
    clearProtectedViews() {
      this.approvals = []; this.handledApprovals = []; this.prompts = {}; this.documents = [];
      this.promptDrafts = {}; this.activateVer = {}; this.archiveOthers = {}; this.weights = {};
      if (['prompt', 'reference'].includes(this.tab)) this.tab = 'chat';
    },
    async refreshIdentity() {
      const epoch = this.authEpoch;
      const d = await this.api('/api/v1/auth/me');
      if (epoch !== this.authEpoch) throw new Error('登录状态已变化');
      if (!['salesperson', 'customer_service', 'finance', 'manager', 'admin'].includes(d.role) ||
          typeof d.user_id !== 'string' || !d.user_id || typeof d.username !== 'string' ||
          (d.department !== null && d.department !== undefined && typeof d.department !== 'string')) {
        this.doLogout('身份响应无效，请重新登录'); throw new Error('身份响应无效，请重新登录');
      }
      if (this.authReady && (this.userId !== d.user_id || this.role !== d.role ||
          this.userDept !== (d.department || ''))) {
        this.doLogout('身份权限已变化，请重新登录'); throw new Error('身份权限已变化，请重新登录');
      }
      this.userId = d.user_id; this.username = d.username; this.role = d.role;
      this.userDept = d.department || ''; this.authReady = true;
      return d;
    },
    async authorize(roles = null) {
      if (!this.token || !this.authReady) throw new Error('请先登录');
      await this.refreshIdentity();
      if (roles && !roles.includes(this.role)) throw new Error('当前身份无权执行此操作');
    },
    async runAction(key, work) {
      if (this.busy[key]) return;
      if (this.uncertain[key]) { this.showToast('上次提交结果未知，请先刷新记录核对'); return; }
      const epoch = this.authEpoch; this.busy[key] = true;
      try { await work(); }
      catch (error) {
        if (epoch === this.authEpoch) {
          if (error.outcomeUnknown) this.uncertain[key] = true;
          this.showToast(error.outcomeUnknown ? '提交结果未知，请刷新记录核对，勿重复提交' : error.message);
        }
      } finally { if (epoch === this.authEpoch) delete this.busy[key]; }

    viewStatus(key) {
      return { loading: '正在加载…', unavailable: '数据不可用，请刷新重试',
        ready: '', idle: '尚未加载' }[this.loadState[key] || 'idle'];
    },
    async loadView(key, path, select, roles = null) {
      const epoch = this.authEpoch, sequence = (this.loadSequence[key] || 0) + 1;
      this.loadSequence[key] = sequence; this.loadState[key] = 'loading';
      this[key] = ['prompts', 'status'].includes(key) ? {} : [];
      try {
        if (roles) await this.authorize(roles);
        const data = select(await this.api(path));
        if (epoch !== this.authEpoch || this.loadSequence[key] !== sequence) return;
        if (!data || typeof data !== 'object' ||
            (!['prompts', 'status'].includes(key) && !Array.isArray(data))) throw new Error('响应格式无效');
        if (Array.isArray(data) && data.some(row => !row || typeof row !== 'object')) throw new Error('列表响应无效');
        if (key === 'prompts' && (Array.isArray(data) || Object.values(data).some(rows =>
            !Array.isArray(rows) || rows.some(row => !row || !Number.isInteger(row.version))))) throw new Error('版本列表无效');
        this[key] = data; this.loadState[key] = 'ready';
        const prefix = { approvals: 'approval:', myApprovals: 'resume:', prompts: 'prompt:' }[key];
        if (prefix) for (const k of Object.keys(this.uncertain))
          if (k.startsWith(prefix)) delete this.uncertain[k];

    renderMd(text) {
      if (!text) return '';
      // CommonMark 侧翼规则:闭合 ** 前是标点(如 %)且后紧跟中文时不算加粗,
      // 「**5%-10%**需…」会漏渲染成字面星号——先把 **x** 统一转 <strong> 再走 marked
      const pre = String(text).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      const escaped = String(text).replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      try {
        if (typeof marked === 'undefined' || typeof marked.parse !== 'function' ||
            typeof DOMPurify === 'undefined' || DOMPurify.isSupported === false ||
            typeof DOMPurify.sanitize !== 'function') return escaped;
        const rendered = marked.parse(pre);
        if (typeof rendered !== 'string') return escaped;
        const clean = DOMPurify.sanitize(rendered);
        return typeof clean === 'string' ? clean : escaped;
      } catch { return escaped; }

    fmtTime(t) {
      if (!t) return '';
      // DB 是 UTC 朴素时间戳(PG 容器时区 UTC + TIMESTAMP 无时区),
      // API 原样输出不带偏移——这里按 UTC 解析,转浏览器本地时区显示
      const s = String(t);
      const hasTz = /(Z|[+-]\d{2}:?\d{2})$/.test(s);
      const d = new Date(s.replace(' ', 'T') + (hasTz ? '' : 'Z'));
      if (isNaN(d)) return s.replace('T', ' ').slice(0, 19);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
        + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    },

      const m = { knowledge_qa: '知识问答', data_operation: '数据操作', multi_task: '多步任务',

      // 清掉进行中的请求状态,避免重登后卡在 pending-bar
      this.pending = false;
      clearInterval(this.streamTimer);
      if (this.streamAbort) { try { this.streamAbort.abort(); } catch (e) {} }
      this.progressText = ''; this.elapsed = 0;
      this.tab = 'chat'; this.refTab = 'customers'; this.backend = '';
    },
    openTab(t) {
      if (!this.authReady || (t === 'prompt' && !this.isApprover)) return;
      this.tab = t;
      if (t === 'approval') { this.loadApprovals(); this.loadMine(); this.loadHandled(); }
      if (t === 'prompt') this.loadPrompts();
      if (t === 'status') this.loadStatus();
    },

    // ===== chat =====
    newSession() {
      if (this.pending) return;
      this.sessionEpoch++;
      this.sessionId = '';
      this.messages = [];
      this.showToast('已开始新会话');
    },
    progressLabel(ev) {
      const names = { planner: '意图识别', agent_executor: '子任务执行', aggregator: '结果汇总' };
      const n = names[ev.node] || ev.node;
      return ev.phase === 'start' ? `⏳ ${n}…` : `✓ ${n}完成`;
    },
    async sendChat() {
      const text = this.draft.trim();
      if (!text || this.pending || !this.authReady) return;
      const epoch = this.authEpoch, generation = this.sessionEpoch;
      const current = () => epoch === this.authEpoch && generation === this.sessionEpoch;
      this.messages.push({ role: 'user', text }); this.draft = ''; this.pending = true;
      delete this.uncertain.cancel;
      this.cancelRequested = false; this.elapsed = 0; this.progressText = '正在处理…';
      const controller = new AbortController(); this.streamAbort = controller;
      const interval = setInterval(() => { if (current()) this.elapsed++; }, 1000);
      this.streamTimer = interval;
      const timeout = setTimeout(() => controller.abort(), 300000);
      let reader, terminal = false, pushed = false;
      let message = { role: 'agent', text: '', sources: [], intent: '', incomplete: true };
      const show = () => { if (!pushed) { this.messages.push(message); message = this.messages[this.messages.length - 1]; pushed = true; } };
      try {
        const resp = await fetch('/api/v1/chat/stream', {
          method: 'POST', redirect: 'error', signal: controller.signal,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token },
          body: JSON.stringify({ message: text, ...(this.sessionId ? { session_id: this.sessionId } : {}) }),
        });
        if (!current()) return;
        if (resp.status === 401) { this.doLogout(); this.loginErr = '登录已过期，请重新登录'; return; }
        if (!resp.ok || !resp.body || !resp.headers.get('content-type')?.startsWith('text/event-stream'))
          throw new Error('流式请求未完成');
        reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8', { fatal: true });
        let buffer = '', total = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (!current()) return;
          if (done) break;
          total += value.byteLength;
          if (total > 2097152) throw new Error('响应超出限制');
          buffer += decoder.decode(value, { stream: true });
          if (buffer.length > 262144) throw new Error('事件超出限制');
          let boundary;
          while ((boundary = /\r?\n\r?\n/.exec(buffer))) {
            const raw = buffer.slice(0, boundary.index);
            buffer = buffer.slice(boundary.index + boundary[0].length);
            const data = raw.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
            if (!data) continue;
            if (terminal) throw new Error('终态后收到重复事件');
            const ev = JSON.parse(data);
            if (!ev || typeof ev !== 'object') throw new Error('无效事件');
            const sid = ev.session_id || (ev.type === 'final' && ev.data?.session_id);
            if (sid) {
              if (typeof sid !== 'string' || (this.sessionId && sid !== this.sessionId)) throw new Error('会话标识不匹配');
              this.sessionId = sid;
            }
            if (ev.type === 'progress') this.progressText = this.progressLabel(ev);
            else if (ev.type === 'token') {
              if (typeof ev.data !== 'string') throw new Error('无效片段');
              show(); message.text += ev.data;
            } else if (ev.type === 'final') {
              const d = ev.data;
              if (!d || !d.session_id || typeof d.answer !== 'string' || (ev.session_id && ev.session_id !== d.session_id)) throw new Error('无效终态');
              show(); terminal = true; message.incomplete = false; message.text = d.answer;
              message.sources = Array.isArray(d.sources) ? d.sources.map(v => v?.kwargs || v).filter(v => v && typeof v === 'object').map(v => ({ ...v, score: Number.isFinite(v.score) ? v.score : 0 })) : [];
              message.confidence = Number.isFinite(d.confidence) ? d.confidence : undefined;
              message.intent = typeof d.intent === 'string' ? d.intent : '';
              message.latencyMs = Number.isFinite(d.latency_ms) ? d.latency_ms : undefined;
              message.cancelled = d.intent === 'cancelled'; this.backend = d.checkpointer_backend || '';
            } else if (ev.type === 'cancelled') {
              show(); terminal = true; message.incomplete = false; message.cancelled = true;
              message.intent = 'cancelled'; message.text += '\n本次对话已由服务端确认取消。';
            } else if (ev.type === 'error') {
              show(); terminal = true; message.intent = 'error'; message.text += '\n服务端报告失败，请核对历史与操作记录。';
            } else throw new Error('未知流式事件');
            this.scrollBottom();
          }
        }
        if (!terminal || buffer.trim() || decoder.decode()) throw new Error('流已中断，未确认完成');
      } catch (error) {
        if (current() && this.token) {
          show(); message.incomplete = true; message.cancelled = false; message.intent = 'error';
          message.text += '\n⚠️ 未确认完成，请核对历史与操作记录，勿直接重复业务操作。';
        }
      } finally {
        clearTimeout(timeout); clearInterval(interval);
        if (reader) { try { await reader.cancel(); } catch {} }
        if (current()) { this.pending = false; this.streamAbort = null; this.progressText = ''; this.scrollBottom(); }
      }
    },
    async cancelChat() {
      if (!this.pending || !this.sessionId || this.cancelRequested) return;
      const generation = this.sessionEpoch;
      await this.runAction('cancel', async () => {
        const d = await this.api('/api/v1/chat/cancel', {
          method: 'POST', body: JSON.stringify({ session_id: this.sessionId }),
        });
        if (generation !== this.sessionEpoch || !this.pending) return;
        this.expectResult(typeof d.cancelled === 'boolean'); this.cancelRequested = d.cancelled;
        this.showToast(d.cancelled ? '取消请求已受理，等待服务端终态' : '未找到运行任务，请核对历史');
      });
    },
    async sendFeedback(m, type) {
      if (!this.sessionId || this.pending || m.fb || m.incomplete || m.cancelled || !['like','dislike'].includes(type)) return;
      const sid = this.sessionId, generation = this.sessionEpoch;
      await this.runAction('feedback:' + sid + ':' + this.messages.indexOf(m), async () => {
        const comment = type === 'dislike' ? window.prompt('反馈原因（取消则不提交）') : '';
        if (comment === null) return;
        const result = await this.api('/api/v1/chat/feedback', { method: 'POST',
          body: JSON.stringify({ session_id: sid, feedback_type: type, comment }) });
        this.expectResult(result.status === 'received');
        if (generation !== this.sessionEpoch || sid !== this.sessionId) return;
        m.fb = type; this.showToast('反馈已记录');
      });
    },
    async loadHistory() {
      if (!this.sessionId || this.pending) return;
      const sid = this.sessionId, generation = this.sessionEpoch;
      await this.runAction('history', async () => {
        const d = await this.api('/api/v1/chat/history/' + encodeURIComponent(sid));
        if (generation !== this.sessionEpoch || sid !== this.sessionId) return;
        if (!d.found) { this.showToast('未找到历史快照'); return; }
        this.messages.push({ role: 'agent', intent: 'history', incomplete: true,
          text: `历史快照（状态：${d.session_status || '未知'}）\n\n${d.final_answer || '无回答'}\n\n快照不代表本次业务执行成功。` });
        this.scrollBottom();
      });
    },
    scrollBottom() {
      this.$nextTick(() => {
        const el = this.$refs.chatBody;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    // ===== approval =====
    async loadApprovals() {
      if (!this.isApprover) { this.approvals = []; return; }
      return this.loadView('approvals', '/api/v1/approvals/pending', d => d.items, ['manager', 'admin']);
    },
    async loadMine() { return this.loadView('myApprovals', '/api/v1/approvals/mine', d => d.items); },
    async loadHandled() {
      if (!this.isApprover) { this.handledApprovals = []; return; }
      return this.loadView('handledApprovals', '/api/v1/approvals/handled', d => d.items, ['manager', 'admin']);
    },
    expectResult(valid) {
      if (!valid) { const error = new Error('响应无效，请核对记录'); error.outcomeUnknown = true; throw error; }
    },
    approvalResult(d, id) {
      this.expectResult(d.approval_id === id && ['pending','approved','rejected','timeout',
        'approved_pending_reauth','executing','executed','execution_failed','execution_unknown',
        'compensated','compensation_failed'].includes(d.status));
      return this.statusLabel(d.status);
    },
    statusLabel(s) {
      const m = {
        pending: '待审批',
        executed: '执行成功',
        executing: '执行中',
        execution_failed: '执行失败',
        execution_unknown: '结果待核对',
        compensated: '执行失败·已补偿',
        compensation_failed: '补偿未完成',
        approved: '已批准',
        rejected: '已拒绝',
        approved_pending_reauth: '已批准·待确认',
        timeout: '已超时',
      };
      return m[s] || s;
    },
    statusClass(s) {
      const m = {
        pending: 'orange',
        executed: 'green',
        executing: 'purple',
        execution_failed: 'orange',
        execution_unknown: 'orange',
        compensated: 'gray',
        compensation_failed: 'orange',
        approved: 'green',
        rejected: 'gray',
        approved_pending_reauth: 'purple',
        timeout: 'gray',
      };
      return m[s] || 'gray';
    },
    async resume(m) {
      if (m.status !== 'approved_pending_reauth') return;
      await this.runAction('resume:' + m.approval_id, async () => {
        await this.authorize();
        const d = await this.api('/api/v1/pending-executions/' + encodeURIComponent(m.approval_id) + '/resume', { method: 'POST', body: '{}' });
        this.showToast(this.approvalResult(d, m.approval_id)); m.status = d.status;
        await this.loadMine();
      });
    },
    async decide(a, decision) {
      if (!this.isApprover || a.resultStatus || !['approved', 'rejected'].includes(decision)) return;
      await this.runAction('approval:' + a.approval_id, async () => {
        const comment = window.prompt('审批意见（取消则不提交）'); if (comment === null) return;
        await this.authorize(['manager', 'admin']);
        const d = await this.api('/api/v1/approval/' + encodeURIComponent(a.approval_id) + '/decide', {
          method: 'POST', body: JSON.stringify({ decision, comment }),
        });
        a.result = this.approvalResult(d, a.approval_id); a.resultStatus = d.status;
        this.showToast(a.result);
        await Promise.all([this.loadApprovals(), this.loadMine(), this.loadHandled()]);
      });
    },

    // ===== prompts =====
    async loadPrompts() {
      return this.loadView('prompts', '/api/v1/prompts', d => d.prompts, ['manager', 'admin']);
    },
    async createVersion(name) {
      const content = (this.promptDrafts[name] || '').trim();
      if (!content) { this.showToast('请先填写内容'); return; }
      await this.runAction('prompt:' + name, async () => {
        await this.authorize(['manager', 'admin']);
        const d = await this.api('/api/v1/prompts/' + encodeURIComponent(name) + '/versions', {
          method: 'POST', body: JSON.stringify({ content }),
        });
        this.expectResult(d.name === name && d.status === 'draft' && Number.isInteger(d.version) && d.version > 0);
        this.promptDrafts[name] = ''; this.showToast(`已创建 v${d.version}`); await this.loadPrompts();
      });
    },
    async activate(name) {
      const version = this.activateVer[name];
      if (!Number.isInteger(version) || version < 1) { this.showToast('请输入正整数版本号'); return; }
      await this.runAction('prompt:' + name, async () => {
        await this.authorize(['manager', 'admin']);
        const d = await this.api('/api/v1/prompts/' + encodeURIComponent(name) + '/activate', {
          method: 'POST', body: JSON.stringify({ version, archive_others: !!this.archiveOthers[name] }),
        });
        this.expectResult(d.name === name && d.version === version && d.status === 'active');
        this.showToast('激活请求已处理，请核对版本列表'); await this.loadPrompts();
      });
    },
    async setTraffic(name, versions) {
      const weights = {};
      for (const v of versions.filter(v => v.status === 'active')) {
        const w = this.weights[name + '_' + v.version];
        if (w !== undefined && w !== null && w !== '') weights[String(v.version)] = Number(w);
      }
      if (!Object.keys(weights).length || Object.values(weights).some(v => !Number.isFinite(v) || v < 0) ||
          Object.values(weights).reduce((a, b) => a + b, 0) <= 0) { this.showToast('请填写有效的非负权重'); return; }
      await this.runAction('prompt:' + name, async () => {
        await this.authorize(['manager', 'admin']);
        const d = await this.api('/api/v1/prompts/' + encodeURIComponent(name) + '/traffic', {
          method: 'PUT', body: JSON.stringify({ weights }),
        });
        this.expectResult(d.name === name && d.weights && Object.keys(d.weights).length === Object.keys(weights).length &&
          Object.entries(weights).every(([key, value]) => d.weights[key] === value));
        this.showToast('流量请求已处理，请核对列表'); await this.loadPrompts();
      });
    },

    // ===== component observations; C21 remains open =====
    async loadStatus() { return this.loadView('status', '/ready', d => d); },
    async openDocsTab() {
      if (!this.isAdmin) return;
      this.refTab = 'docs'; await this.loadDocuments();
    },
    async loadDocuments() {
      return this.loadView('documents', '/api/v1/admin/documents?limit=100', d => d.data?.items, ['admin']);
    },
  },
  mounted() {
    document.addEventListener('click', () => { this.pickerOpen = false; });
    if (location.protocol === 'file:') {
      // 直接双击 index.html 打开时无法访问后端,给出明确指引而非"Failed to fetch"
      this.loginErr = '⚠️ 请通过 http://localhost:8000/ui 访问本系统(当前以 file:// 打开,无法连接后端)';
      return;
    }
    const boot = document.getElementById?.('boot-error'); if (boot) boot.hidden = true;
    const epoch = this.authEpoch;
    if (this.token) this.refreshIdentity().catch(() => {
      if (epoch === this.authEpoch) { this.doLogout(); this.loginErr = '身份核验失败，请重新登录'; }
    });
  },
}).mount('#app');
ssoHandoff = {}; // Do not retain a second reference to the handoff credential.
</script>
</body>
</html>
