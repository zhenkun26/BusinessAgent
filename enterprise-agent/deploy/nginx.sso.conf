# Controlled loopback gateway; no request/query/body logging.
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /sso-tls/gateway.crt;
    ssl_certificate_key /sso-tls/gateway.key;
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name app.reference.test;
        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 300s;
            add_header Referrer-Policy no-referrer always;
        }
    }
    server {
        listen 8443 ssl;
        server_name idp.reference.test;
        location /control/ { return 404; }
        location / {
            proxy_pass https://reference-idp:8443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /sso-tls/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name reference-idp;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}
