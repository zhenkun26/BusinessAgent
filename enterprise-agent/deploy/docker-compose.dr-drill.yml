# C22 activation guard. Use with prod + original reviewed overlays + generated volume mapping.
# All target volumes must be restored external volumes in a fresh c22-restore-* project.
# Start stores using an explicit service list. No cleanup or automatic application replay.
# See docs/50-engineering/retained-recovery.md; this recipe has not run on Linux.
services:
  api:
    profiles: [recovery-activation]
  api2:
    profiles: [recovery-activation]
    extends:
      file: docker-compose.prod.yml
      service: api
    # Enable only if the source used api2; review all original environment/network overlays.
  worker:
    profiles: [recovery-activation]
  nginx:
    profiles: [recovery-gateway]
