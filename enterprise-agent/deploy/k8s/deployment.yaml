apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: hello-zhiduoxing
  labels:
    app: agent-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      # 非 root 运行(镜像内已 USER 65534;此处双保险)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: agent
          image: <YOUR_REGISTRY>/enterprise-agent:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          env:
            # 容器内通过服务名访问基础设施
            - name: MILVUS_HOST
              value: milvus
            - name: POSTGRES_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # 存活探针:进程是否存活(轻量,不查依赖)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # 就绪探针:依赖(db/milvus/checkpointer)是否可用,滚动更新期间断流保护
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /data/hf_cache
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
