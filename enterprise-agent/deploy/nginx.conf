# Nginx 生产配置(反代 API + HTTPS + 限流)

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式(含请求耗时,便于排查)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20m;  # 文档上传限制

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # 限流区(按 IP,防 DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # 上游 API 服务(docker-compose 网络内)
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # HTTP → HTTPS 跳转
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL 证书(挂载 ./deploy/certs/)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Shared forwarding policy; keep request paths and query strings unchanged.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # API 路由
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://api_backend;

            # 长连接支持(LangGraph 长流程可能耗时较长)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # SSE must reach the client incrementally; these routes do not use WebSocket.
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        location = / {
            return 302 /ui/;
        }

        location = /ui {
            return 302 /ui/;
        }

        location /ui/ {
            proxy_pass http://api_backend;
        }

        # 健康检查(不限流,供 LB 探测)
        location = /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        location = /ready {
            proxy_pass http://api_backend;
            access_log off;
        }

        # 文档(生产可关闭)
        location = /docs {
            proxy_pass http://api_backend;
        }

        location = /docs/oauth2-redirect {
            proxy_pass http://api_backend;
        }

        location = /redoc {
            proxy_pass http://api_backend;
        }

        location = /openapi.json {
            proxy_pass http://api_backend;
        }

        # Prometheus scrapes api:8000 directly on the Compose network.
        location = /metrics {
            return 404;
        }

        location /metrics/ {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
