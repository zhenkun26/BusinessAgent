name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly publish the verified image from main
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            record-id: ci-3-11
          - python-version: "3.13"
            record-id: ci-3-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（离线测试无需 Docker/LLM/向量库）
        run: |
          pip install -r enterprise-agent/deploy/requirements-prod.txt
          pip install pytest pytest-asyncio pytest-cov fakeredis

      - name: Verify explicit publication policy
        run: python -I -B .github/tests/test_publish_policy.py

      - name: Verify current offline candidate (Python, Node and integrity controls)
        run: python -I -B enterprise-agent/scripts/offline_verify.py --ci --record ${{ matrix.record-id }}

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: enterprise-agent/eval/results/offline-pytest-*/coverage.xml
          if-no-files-found: error

      # ---- security-hardening-plus 2.2:密钥扫描兜底(命中疑似密钥即失败) ----
      - name: 安装固定版本 Gitleaks（校验官方归档摘要）
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.24.3"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c \
            "$tool_dir/archive.tar.gz" | sha256sum --check -
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: 秘密扫描范围回归（真实 Git 和合成秘密）
        run: python -m unittest discover -s .github/tests -p test_secret_scan.py

      - name: 密钥扫描兜底（事件历史与精确最终树）
        run: >-
          python .github/scripts/scan_secrets.py
          --output "$RUNNER_TEMP/secret-scan-${{ matrix.python-version }}"

      - name: 保存扫描覆盖摘要（不上传秘密报告或原始日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-summary-${{ matrix.python-version }}
          path: ${{ runner.temp }}/secret-scan-${{ matrix.python-version }}/summary.json
          if-no-files-found: warn

      # ---- security-hardening-plus 3.1:依赖漏洞扫描(未豁免条目阻断) ----
      - name: 依赖漏洞扫描（pip-audit）
        working-directory: enterprise-agent
        run: |
          pip install pip-audit
          # 豁免清单:仅 Medium 及以下可豁免(带复评日期),其余条目(High/Critical)阻断
          EXEMPTIONS=$(grep -vE '^\s*(#|$)' deploy/security-exemptions.txt \
            | cut -d'|' -f1 | tr -d ' ' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r deploy/requirements-prod.txt --progress-spinner off $EXEMPTIONS \
            --output pip-audit-report.txt

      - name: 上传 pip-audit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-${{ matrix.python-version }}
          path: enterprise-agent/pip-audit-report.txt
          if-no-files-found: ignore

  docker:
    name: 构建生产镜像（多阶段）
    needs: [test, c10-persistence, synthetic-demo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 Buildx（容器驱动,支持 gha 缓存）
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅加载到本地，扫描通过后才发布）
        uses: docker/build-push-action@v6
        with:
          context: enterprise-agent
          file: enterprise-agent/Dockerfile.prod
          build-args: |
            INSTALL_ML=0
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/businessagent:latest
            ghcr.io/${{ github.repository_owner }}/businessagent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 核对并保存实际镜像依赖与身份
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/businessagent
        run: |
          docker run --rm --network none --read-only --entrypoint python "$IMAGE:$GITHUB_SHA" \
            -I -B /build-info/scripts/verify_build.py --root /build-info --installed \
            > installed-inventory.json
          docker image inspect "$IMAGE:$GITHUB_SHA" > image-identity.json

      - name: 上传构建输入与实际安装清单
        uses: actions/upload-artifact@v4
        with:
          name: production-build-inventory
          path: |
            installed-inventory.json
            image-identity.json
            enterprise-agent/deploy/build-inputs.json
            enterprise-agent/deploy/requirements-prod.lock
          if-no-files-found: error

      # ---- security-hardening-plus 3.2/3.3:镜像漏洞扫描(High/Critical 阻断) ----
      - name: 生成 Trivy 豁免文件（.trivyignore）
        run: |
          grep -vE '^\s*(#|$)' enterprise-agent/deploy/security-exemptions.txt \
            | cut -d'|' -f1 | tr -d ' ' > .trivyignore || true
          touch .trivyignore

      - name: 镜像漏洞扫描（Trivy，High/Critical 阻断）
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/businessagent:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: 登录 GHCR（所有验证通过后，仅显式 main 手动发布）
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布已扫描镜像（不重新构建）
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/businessagent
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: 上传 Trivy 扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore


  c10-persistence:
    name: C10 isolated persistence slice (not full acceptance)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Provision and record native libpq prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5
          dpkg-query -W -f='${Package} ${Version}\n' libpq5
      - name: Install exact declared dependencies
        run: pip install -r enterprise-agent/deploy/requirements-prod.txt
      - name: Reject dotenv and inherited configuration leakage
        run: python -I -B enterprise-agent/eval/c10_live_acceptance/check_entry.py
      - name: Verify real isolated PG and Redis persistence slice
        run: python -I -B enterprise-agent/eval/c10_live_acceptance/run.py --execute
      - name: Retain sanitized phase report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-persistence-report
          path: enterprise-agent/eval/results/c10-persistence-*/report.json
          if-no-files-found: error

  synthetic-demo:
    name: Synthetic demo on native libpq (not RAG acceptance)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Provision and record native libpq prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5
          dpkg-query -W -f='${Package} ${Version}\n' libpq5
      - name: Install existing production dependencies only
        run: pip install -r enterprise-agent/deploy/requirements-prod.txt
      - name: Require native libpq without binary or C wrapper packages
        run: |
          python -I -B -c 'import importlib.util as u; import psycopg; assert u.find_spec("psycopg_binary") is None; assert u.find_spec("psycopg_c") is None; assert psycopg.pq.__impl__ == "python"; print("native libpq", psycopg.pq.version())'
      - name: Start fresh synthetic demo and verify actual HTTP ownership
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -B enterprise-agent/scripts/run_synthetic_demo.py start --execute \
            --run-dir "$RUNNER_TEMP/ba-demo-native" \
            > "$RUNNER_TEMP/ba-demo-native-private.log" 2>&1
          python -I -B enterprise-agent/scripts/check_synthetic_demo.py --execute \
            --require-python-driver --run-dir "$RUNNER_TEMP/ba-demo-native"
      - name: Stop owned demo resources without deleting retained data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/ba-demo-native/receipt.json" ] && [ -f "$RUNNER_TEMP/ba-demo-native/private-state.json" ]; then
            python -I -B enterprise-agent/scripts/run_synthetic_demo.py stop --execute \
              --run-dir "$RUNNER_TEMP/ba-demo-native"
          fi
      - name: Retain sanitized synthetic acceptance report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-native-report
          path: ${{ runner.temp }}/ba-demo-native/acceptance-*.json
          if-no-files-found: error
