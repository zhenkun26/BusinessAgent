name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（离线测试无需 Docker/LLM/向量库）
        run: |
          pip install -r enterprise-agent/deploy/requirements-prod.txt
          pip install pytest pytest-asyncio pytest-cov fakeredis

      - name: 运行单元测试 + 覆盖率
        working-directory: enterprise-agent
        run: |
          PYTHONPATH=. python -m pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: enterprise-agent/coverage.xml
          if-no-files-found: ignore

      # ---- security-hardening-plus 2.2:密钥扫描兜底(命中疑似密钥即失败) ----
      - name: 密钥扫描兜底（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # ---- security-hardening-plus 3.1:依赖漏洞扫描(未豁免条目阻断) ----
      - name: 依赖漏洞扫描（pip-audit）
        working-directory: enterprise-agent
        run: |
          pip install pip-audit
          # 豁免清单:仅 Medium 及以下可豁免(带复评日期),其余条目(High/Critical)阻断
          EXEMPTIONS=$(grep -vE '^\s*(#|$)' deploy/security-exemptions.txt \
            | cut -d'|' -f1 | tr -d ' ' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r deploy/requirements-prod.txt --progress-spinner off $EXEMPTIONS \
            | tee pip-audit-report.txt

      - name: 上传 pip-audit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-${{ matrix.python-version }}
          path: enterprise-agent/pip-audit-report.txt
          if-no-files-found: ignore

  docker:
    name: 构建生产镜像（多阶段）
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 Buildx（容器驱动,支持 gha 缓存）
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（仅 push 事件）
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建镜像（PR 只构建不推送；load 本地供 Trivy 扫描）
        uses: docker/build-push-action@v6
        with:
          context: enterprise-agent
          file: enterprise-agent/Dockerfile.prod
          push: ${{ github.event_name == 'push' }}
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/businessagent:latest
            ghcr.io/${{ github.repository_owner }}/businessagent:${{ github.sha }}
            businessagent:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- security-hardening-plus 3.2/3.3:镜像漏洞扫描(High/Critical 阻断) ----
      - name: 生成 Trivy 豁免文件（.trivyignore）
        run: |
          grep -vE '^\s*(#|$)' enterprise-agent/deploy/security-exemptions.txt \
            | cut -d'|' -f1 | tr -d ' ' > .trivyignore || true
          touch .trivyignore

      - name: 镜像漏洞扫描（Trivy，High/Critical 阻断）
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: businessagent:ci-scan
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: 上传 Trivy 扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
